name: iOS Build

# Builds, tests and archives FLEX UP. A separate job exports a SIGNED .ipa
# only when Apple signing secrets are configured (see README → «Подпись и IPA»).
on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "IPA export method (used only when signing secrets exist)"
        type: choice
        options: [ad-hoc, development, app-store]
        default: ad-hoc
      run_ui_tests:
        description: "Run UI smoke tests on the simulator"
        type: boolean
        default: true
  push:
    branches: [main, develop, "release/**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCHEME: FlexUp
  PROJECT: FlexUp.xcodeproj

jobs:
  # ---------------------------------------------------------------
  # Fast checks on Linux: business logic + database/RLS tests
  # ---------------------------------------------------------------
  core-tests:
    name: FlexCore unit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --package-path Packages/FlexCore 2>&1 | tee core-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-tests-log
          path: core-tests.log

  database-tests:
    name: Supabase schema + RLS tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - name: Apply migrations and run tests
        run: bash ./scripts/test_database.sh

  # ---------------------------------------------------------------
  # iOS: build, test on Simulator, archive (unsigned)
  # ---------------------------------------------------------------
  ios:
    name: Build, test & archive (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' ! -iname '*beta*' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v xcbeautify >/dev/null || brew install xcbeautify
          xcodegen generate

      - name: Write Secrets.xcconfig (optional Supabase config)
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          : > Config/Secrets.xcconfig
          if [ -n "$SUPABASE_HOST" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_HOST = $SUPABASE_HOST" >> Config/Secrets.xcconfig
            echo "SUPABASE_ANON_KEY = $SUPABASE_ANON_KEY" >> Config/Secrets.xcconfig
            echo "Backend: Supabase (configured from secrets)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Backend: demo mode (SUPABASE_* secrets not set)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted([r for r in data if "iOS" in r], reverse=True)
          for r in runtimes:
              for d in data[r]:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      print(d["udid"]); sys.exit(0)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Unit tests (app + FlexCore)
        run: |
          set -o pipefail
          xcodebuild test -project "$PROJECT" -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skip-testing:FlexUpUITests \
            -resultBundlePath build/UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-unit-tests.log | xcbeautify || exit "${PIPESTATUS[0]}"

      - name: UI smoke tests
        if: github.event_name != 'workflow_dispatch' || inputs.run_ui_tests
        continue-on-error: true   # simulator UI tests can be flaky on shared runners; results are uploaded anyway
        run: |
          set -o pipefail
          xcodebuild test -project "$PROJECT" -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:FlexUpUITests \
            -resultBundlePath build/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-ui-tests.log | xcbeautify || exit "${PIPESTATUS[0]}"

      - name: Archive for generic iOS device (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/FlexUp.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build-archive.log | xcbeautify || exit "${PIPESTATUS[0]}"
          ditto -c -k --keepParent build/FlexUp.xcarchive build/FlexUp-unsigned.xcarchive.zip
          {
            echo "### Результат"
            echo "- ✅ Архив собран: \`FlexUp-unsigned.xcarchive.zip\`"
            echo "- ⚠️ **IPA требует Apple code signing**: добавь секреты IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROVISION_PROFILE_BASE64, IOS_TEAM_ID — тогда job «Signed IPA» соберёт устанавливаемый .ipa."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package unsigned IPA (for Sideloadly / AltStore re-signing)
        run: |
          # NOT installable as-is: iOS requires a signature. Sideloadly/AltStore re-sign it with the
          # user's own Apple ID (free account: app works 7 days). The file name says "unsigned" on purpose.
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R build/FlexUp.xcarchive/Products/Applications/FlexUp.app build/Payload/
          (cd build && zip -qry FlexUp-unsigned.ipa Payload)
          ls -lh build/FlexUp-unsigned.ipa
          echo "- 📦 \`FlexUp-unsigned.ipa\` — неподписанный, ставится через Sideloadly/AltStore с твоим Apple ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: FlexUp-unsigned-xcarchive
          path: build/FlexUp-unsigned.xcarchive.zip
          retention-days: 14

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlexUp-unsigned-ipa-for-sideloadly
          path: build/FlexUp-unsigned.ipa
          retention-days: 14

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-and-test-results
          path: |
            build-*.log
            build/*.xcresult
          retention-days: 14

  # ---------------------------------------------------------------
  # Signed IPA (runs only when signing secrets are present)
  # ---------------------------------------------------------------
  signing-check:
    name: Detect signing secrets
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets found → Signed IPA job will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets missing → only an unsigned archive is produced (IPA требует Apple code signing)." >> "$GITHUB_STEP_SUMMARY"
          fi

  ipa:
    name: Signed IPA (xcodebuild -exportArchive)
    needs: [signing-check, ios]
    if: needs.signing-check.outputs.enabled == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EXPORT_METHOD: ${{ inputs.export_method || secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' ! -iname '*beta*' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Generate project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v xcbeautify >/dev/null || brew install xcbeautify
          xcodegen generate

      - name: Import certificate into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD_SECRET: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD_SECRET:-$(openssl rand -hex 24)}"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/flexup-signing.keychain-db"
          CERT="$RUNNER_TEMP/cert.p12"
          echo "$P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN" >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046  # intentional word splitting of the existing keychain list
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT"
          # SHA-1 of the imported identity: unambiguous for both codesign and ExportOptions.
          SIGN_HASH=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1 {print $2}')
          [ -n "$SIGN_HASH" ] || { echo "::error::No code signing identity found in the .p12"; exit 1; }
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$SIGN_HASH" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          BUNDLE_ID_SECRET: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          BUNDLE_ID="${BUNDLE_ID_SECRET:-${APP_ID#*.}}"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          {
            echo "PROFILE_UUID=$UUID"
            echo "PROFILE_NAME=$NAME"
            echo "BUNDLE_ID=$BUNDLE_ID"
          } >> "$GITHUB_ENV"
          echo "Profile: $NAME → $BUNDLE_ID"

      - name: Write Secrets.xcconfig
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          {
            echo "FLEXUP_TEAM_ID = $TEAM_ID"
            echo "FLEXUP_BUNDLE_ID = $BUNDLE_ID"
            [ -n "$SUPABASE_HOST" ] && echo "SUPABASE_HOST = $SUPABASE_HOST"
            [ -n "$SUPABASE_ANON_KEY" ] && echo "SUPABASE_ANON_KEY = $SUPABASE_ANON_KEY"
            true
          } > Config/Secrets.xcconfig

      - name: Archive (signed)
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/FlexUp.xcarchive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            2>&1 | tee build-signed-archive.log | xcbeautify || exit "${PIPESTATUS[0]}"

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>${SIGN_IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/FlexUp.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/ipa \
            2>&1 | tee build-export.log | xcbeautify || exit "${PIPESTATUS[0]}"
          ls -la build/ipa
          codesign -dv --verbose=2 build/FlexUp.xcarchive/Products/Applications/FlexUp.app 2>&1 | grep -E "Authority|TeamIdentifier" | head -3
          echo "### ✅ Подписанный IPA собран (${EXPORT_METHOD})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlexUp-signed-ipa-${{ env.EXPORT_METHOD }}
          path: build/ipa/*.ipa
          retention-days: 14

      - name: Upload to TestFlight (optional)
        if: env.EXPORT_METHOD == 'app-store'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "App Store Connect API key not configured — skipping TestFlight upload."
            exit 0
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_"${ASC_KEY_ID}".p8
          IPA=$(find build/ipa -name '*.ipa' | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_"${ASC_KEY_ID}".p8

      - name: Upload signing logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signing-logs
          path: build-*.log
          retention-days: 7

      - name: Clean up keychain and profile
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          if [ -n "${PROFILE_UUID:-}" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi
          rm -f "$RUNNER_TEMP"/profile.* "$RUNNER_TEMP"/ExportOptions.plist Config/Secrets.xcconfig
